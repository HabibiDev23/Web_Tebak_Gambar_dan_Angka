<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="src/result.css">
    <script src="src/script.js"></script>

    <link rel="icon" type="image/svg+xml" href="">
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:ital,opsz,wght@0,14..32,100..900;1,14..32,100..900&family=Outfit:wght@100..900&family=Plus+Jakarta+Sans:ital,wght@0,200..800;1,200..800&family=Space+Grotesk:wght@300..700&display=
                                 swap">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.7.2/css/all.min.css">
    <title>Mindmetric - Hasil Kognitifmu</title>
</head>
<body>

    <header>
        <nav>
            <div class="left-nav">
                <a href="#home">Beranda</a>
                <a href="#about">Tentang</a>
                <a href="#feature">Fitur</a>
            </div>

            <div class="center-nav">
                <img src="src/shapeonly-dark.png" alt="Logo Utama">
                <label class="theme-switch" for="theme-switch" aria-label="Ganti tema gelap dan terang">
                    <input type="checkbox" id="theme-switch" class="theme-switch__input">
                    <span class="theme-switch__track">
                        <span class="theme-switch__stars" aria-hidden="true">
                            <span></span>
                            <span></span>
                            <span></span>
                        </span>
                        <span class="theme-switch__cloud" aria-hidden="true"></span>
                        <span class="theme-switch__knob" aria-hidden="true"></span>
                    </span>
                </label>
            </div>

            <div class="right-nav">
                <a href="#process">Proses</a>
                <a href="#main">Mulai</a>
                <a href="#biodata">Biodata</a>
            </div>
        </nav>
    </header>

    <main>
        <div class="result-container">
            <div class="ilustration-box">
                <img src="" alt="Ilustrasi SVG no background Otak">
            </div>

            <div class="kognitifnumber-box">
                <h1 id="angka-kognitif"></h1>
                <p id="deskripsi-kognitif"></p>
            </div>
        </div>
    </main>

    <footer>
        <div class="footer-container">
            <div class="left-footer">
                <img src="src/1.png" alt="Logo Utama">
                <p>Platform evaluasi kognitif dan metrik penalaran logis berbasis web modern.</p>
                <div class="social-box">
                    <a href="" target="_blank"><i class="fa-brands fa-github"></i></a>
                    <a href="" target="_blank"><i class="fa-brands fa-instagram"></i></a>
                    <a href="" target="_blank"><i class="fa-brands fa-x-twitter"></i></a>
                </div>
            </div>

            <div class="center-footer">
                <h4>Navigasi</h4>
                <ul>
                    <li>
                        <a href="#home">Beranda</a>
                        <a href="#about">Tentang</a>
                        <a href="#feature">Fitur</a>
                        <a href="#process">Proses</a>
                    </li>
                </ul>
            </div>

            <div class="lowleft-footer">
                <p>&copy; 2026 <span>MindMetric</span>. All Rights Reserved.</p>
            </div>
        </div>
    </footer>
    
</body>
</html>
